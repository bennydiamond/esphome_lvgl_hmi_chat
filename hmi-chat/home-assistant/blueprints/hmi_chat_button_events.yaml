blueprint:
  name: HMI Chat - Button Events (Blueprint)
  description: |-
    Handle ESPHome HMI events and map them to Petlibro actions (Dual Feeder Support).
    Version: 1.1.0
  domain: automation
  source_url: https://raw.githubusercontent.com/bennydiamond/esphome_lvgl_hmi_chat/main/hmi-chat/home-assistant/blueprints/automation/hmi_chat_button_events.yaml
  homeassistant:
    min_version: 2024.4.0
  input:
    hmi_device:
      name: HMI Chat Device
      description: Select the HMI Chat ESPHome device emitting events.
      selector:
        device: {}
        
    # --- FEEDER 1 (La P'tite Crisse) ---
    feeder1_open_lid_button:
      name: Feeder 1 - Open lid button
      selector:
        entity:
          domain: button
    feeder1_manual_feed_button:
      name: Feeder 1 - Manual feed button
      selector:
        entity:
          domain: button
    feeder1_manual_feed_quantity_select:
      name: Feeder 1 - Manual feed quantity select
      selector:
        entity:
          domain: select
    feeder1_dessiccant_replaced_button:
      name: Feeder 1 - Dessiccant replaced button
      selector:
        entity:
          domain: button

    # --- FEEDER 2 (Miss Puke) ---
    feeder2_open_lid_button:
      name: Feeder 2 - Open lid button
      selector:
        entity:
          domain: button
          multiple: false
      default: {}
    feeder2_manual_feed_button:
      name: Feeder 2 - Manual feed button
      selector:
        entity:
          domain: button
          multiple: false
      default: {}
    feeder2_manual_feed_quantity_select:
      name: Feeder 2 - Manual feed quantity select
      selector:
        entity:
          domain: select
          multiple: false
      default: {}
    feeder2_dessiccant_replaced_button:
      name: Feeder 2 - Dessiccant replaced button
      selector:
        entity:
          domain: button
          multiple: false
      default: {}

    # --- FOUNTAIN ---
    fountain_filter_reset_button:
      name: Fountain filter reset button
      selector:
        entity:
          domain: button
    fountain_cleaning_reset_button:
      name: Fountain cleaning reset button
      selector:
        entity:
          domain: button
    fountain_dispensing_mode_select:
      name: Fountain dispensing mode select
      description: Home Assistant select entity for fountain water dispensing mode.
      selector:
        entity:
          domain: select


trigger:
  - platform: event
    event_type: esphome.button_pressed
    event_data:
      device_id: !input hmi_device
  - platform: event
    event_type: esphome.set_entity_value
    event_data:
      device_id: !input hmi_device
  - platform: event
    event_type: esphome.select_changed
    event_data:
      device_id: !input hmi_device

variables:
  device_id: !input hmi_device
  esphome_node_service_prefix: "{{ 'esphome.' ~ device_attr(device_id, 'name') | lower | replace(' ', '_') | replace('-', '_') }}"
  ack_feeder1_dessiccant_service: "{{ esphome_node_service_prefix ~ '_confirm_feeder1_dessiccant_reset_req_received' }}"
  ack_feeder2_dessiccant_service: "{{ esphome_node_service_prefix ~ '_confirm_feeder2_dessiccant_reset_req_received' }}"
  ack_filter_service: "{{ esphome_node_service_prefix ~ '_confirm_fountain_filter_reset_req_received' }}"
  ack_clean_service: "{{ esphome_node_service_prefix ~ '_confirm_fountain_clean_reset_req_received' }}"
  fountain_dispensing_mode_select_entity: !input fountain_dispensing_mode_select

condition: []

action:
  - choose:
      # ==========================================
      # FEEDER 1 ACTIONS
      # ==========================================
      - conditions:
          - alias: Si le bouton ouvrir la mangeoire 1
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder1_open_door' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input feeder1_open_lid_button

      - conditions:
          - alias: Si le bouton nourrir 1 a été appuyé
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder1_manual_dispense' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input feeder1_manual_feed_button

      - conditions:
          - alias: Si réduire quantité nourriture 1
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder1_reduce_manual_feed' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: select.select_previous
            data:
              cycle: true
            target:
              entity_id: !input feeder1_manual_feed_quantity_select

      - conditions:
          - alias: Si augmenter quantité nourriture 1
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder1_increase_manual_feed' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: select.select_next
            data:
              cycle: true
            target:
              entity_id: !input feeder1_manual_feed_quantity_select

      - conditions:
          - alias: Si définir la quantité 1
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'feeder1_set_manual_feed' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: select.select_option
            data:
              option: "{{ trigger.event.data.value }}"
            target:
              entity_id: !input feeder1_manual_feed_quantity_select

      - conditions:
          - alias: Si reset dessiccant 1 confirmé
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder1_reset_dessiccant' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input feeder1_dessiccant_replaced_button
          - service: "{{ ack_feeder1_dessiccant_service }}"

      # ==========================================
      # FEEDER 2 ACTIONS
      # ==========================================
      - conditions:
          - alias: Si le bouton ouvrir la mangeoire 2
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder2_open_door' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input feeder2_open_lid_button

      - conditions:
          - alias: Si le bouton nourrir 2 a été appuyé
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder2_manual_dispense' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input feeder2_manual_feed_button

      - conditions:
          - alias: Si réduire quantité nourriture 2
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder2_reduce_manual_feed' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: select.select_previous
            data:
              cycle: true
            target:
              entity_id: !input feeder2_manual_feed_quantity_select

      - conditions:
          - alias: Si augmenter quantité nourriture 2
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder2_increase_manual_feed' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: select.select_next
            data:
              cycle: true
            target:
              entity_id: !input feeder2_manual_feed_quantity_select

      - conditions:
          - alias: Si définir la quantité 2
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'feeder2_set_manual_feed' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: select.select_option
            data:
              option: "{{ trigger.event.data.value }}"
            target:
              entity_id: !input feeder2_manual_feed_quantity_select

      - conditions:
          - alias: Si reset dessiccant 2 confirmé
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_feeder2_reset_dessiccant' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input feeder2_dessiccant_replaced_button
          - service: "{{ ack_feeder2_dessiccant_service }}"

      # ==========================================
      # FOUNTAIN ACTIONS
      # ==========================================
      - conditions:
          - alias: Si le mode de distribution changé
            condition: template
            value_template: >-
              {{ trigger.event.event_type == 'esphome.select_changed' and
                 trigger.event.data.message == 'select_fountain_dispensing_mode_changed' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fountain_dispensing_mode_select
            data:
              option: "{{ state_attr(fountain_dispensing_mode_select_entity, 'options')[ (trigger.event.data.selected_option | int) ] }}"

      - conditions:
          - alias: Si reset filtre fontaine confirmé
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_fountain_reset_filter' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input fountain_filter_reset_button
          - service: "{{ ack_filter_service }}"

      - conditions:
          - alias: Si reset nettoyage fontaine confirmé
            condition: template
            value_template: >-
              {{ trigger.event.data.message == 'button_fountain_reset_clean' and
                 ((now() - trigger.event.time_fired).total_seconds() < 3) }}
        sequence:
          - service: button.press
            target:
              entity_id: !input fountain_cleaning_reset_button
          - service: "{{ ack_clean_service }}"

mode: single