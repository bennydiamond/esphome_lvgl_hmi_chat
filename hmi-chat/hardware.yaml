api:
  actions:
    - action: confirm_fountain_filter_reset_req_received
      then:
        - if:
            condition:
              - script.is_running: id_script_reset_dialog_confirm_execute_fountain_filter
            then:
              - lvgl.label.update:
                  id: id_lab_fountain_filter_remaining_days
                  text: ${cloud_refresh}
                  text_font: mdi_icons_22
              - lvgl.widget.hide: id_lv_but_fountain_reset_filter
    - action: confirm_fountain_clean_reset_req_received
      then:
        - if:
            condition:
              - script.is_running: id_script_reset_dialog_confirm_execute_fountain_clean
            then:
              - lvgl.label.update:
                  id: id_lab_fountain_clean_remaining_days
                  text: ${cloud_refresh}
                  text_font: mdi_icons_22
              - lvgl.widget.hide: id_lv_but_fountain_reset_clean

http_request:
  verify_ssl: false

debug:
  update_interval: 10s


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.1.135
  power_save_mode: LIGHT # LIGHT is default for ESP32
  passive_scan: True
  manual_ip:
    static_ip: 192.168.1.135
    gateway: 192.168.0.3
    subnet: 255.255.254.0
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "HMI Entree Fallback hotspot"
    password: !secret wifi_password

captive_portal:
  
web_server:
  port: 80
  include_internal: True

time:
  - id: !extend id_sntp_time
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
    on_time_sync:
      then:
        - script.execute: time_update 

psram:
  mode: octal
  speed: 80MHz

spi:
  - type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

i2c:
  - sda: 4
    scl: 8

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
      id: id_sensor_debug_device_info
      internal: True
      filters:
        - lambda: |-
            std::string str = x;
            if (str.length() > 264) {
              return str.substr(0, 264);
            }
            return str;
        - lambda: |-
            std::replace(x.begin(), x.end(), '|', '\n');
            return x;
        - prepend: "ESPHome version: "
      on_value:
        then:
          - lvgl.label.update:
              id: id_lv_lab_debug_device_info
              text: !lambda "return x.c_str();"

sensor:
  - id: !extend id_sensor_wifi_signal
    on_value: 
      then:
        - lvgl.label.update:
            id: id_lv_lab_wifi_status
            text_color: !lambda |-
              if (id(id_sensor_wifi_signal).state < 0) {
              return lv_color_hex(0x00FF00);
              }
              return lv_color_hex(0x333333);
            text: !lambda |-
              if (id(id_sensor_wifi_signal).state <= -80) {
              return "${wifi_25}";
              } else if (id(id_sensor_wifi_signal).state > -80 && id(id_sensor_wifi_signal).state <= -70) {
              return "${wifi_50}";
              } else if (id(id_sensor_wifi_signal).state > -70 && id(id_sensor_wifi_signal).state <= -60) {
              return "${wifi_75}";
              } else if (id(id_sensor_wifi_signal).state > -60) {
              return "${wifi_100}";
              }
              return "${wifi_100}";
        - globals.set:
              id: id_global_rssi
              value: !lambda 'return (int)x;'
  - platform: debug
    free:
      name: "Heap Free"
      id: id_sensor_debug_heap_free
      internal: True
      on_value: 
        then:
          - lvgl.label.update:
              id: id_lv_lab_debug_heap_free
              text:
                format: "Heap free: %.3fkB"
                args: [x / 1024]
    loop_time:
      name: "Loop Time"
      id: id_sensor_debug_loop_time
      internal: True
      on_value: 
        then:
          - lvgl.label.update:
              id: id_lv_lab_debug_loop_time
              text:
                format: "Loop time: %.0fms"
                args: [x]
    psram:
      name: "Free PSRAM"
      id: id_sensor_debug_free_psram
      internal: True
      on_value: 
        then:
          - lvgl.label.update:
              id: id_lv_lab_debug_psram_free
              text:
                format: "PSRAM free: %.3fkB"
                args: [x / 1024]

# Backlight
output:
  - id: id_output_backlight_brightness
    platform: ledc
    pin: 1
    min_power: 0.07

light:
  - platform: monochromatic
    id: id_light_backlight_brightness
    output: id_output_backlight_brightness
    name: "Backlight Brightness"
    restore_mode: ALWAYS_ON
    on_state:
      then:
        - lvgl.slider.update:
            id: id_lv_slider_backlight_brigthness
            value: !lambda "return id(id_light_backlight_brightness).remote_values.get_brightness() * 100.0;"
        - lvgl.label.update:
            id: id_lv_lab_backlight_brightness
            text:
                format: "%u%%"
                args: [(uint8_t)(id(id_light_backlight_brightness).remote_values.get_brightness() * 100)]


display: 
  - platform: mipi_spi
    model: jc3248w535

touchscreen:
  - id: main_touchscreen
    platform: axs15231
    on_update:
      then:
        - script.execute: id_script_backlight_timeout


script: !include display/lvgl/page_home/datetime_widget_scripts.yaml