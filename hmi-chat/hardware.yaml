esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency : 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: y
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_IDF_EXPERIMENTAL_FEATURES: y
      CONFIG_SPIRAM_SPEED_80M: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_LV_ATTRIBUTE_FAST_MEM: y
      CONFIG_LV_MEMCPY_MEMSET_STD: y
      CONFIG_LV_DEF_REFR_PERIOD: "16"
      CONFIG_LV_DRAW_SW_SHADOW_CACHE_SIZE: "32" 
    advanced:
      loop_task_stack_size: 16384

esphome:
  name: ${dname}
  min_version: 2026.7.0
  on_boot:
    - priority: 500 # a bit after sensor init
      then:
        - number.set:
            id: id_num_awake_backlight_brightness
            value: 100
        - number.set:
            id: id_num_idle_backlight_brightness
            value: 20
    - priority: -100 # everything should be initialized
      then:
        - script.execute: id_script_backlight_timeout

